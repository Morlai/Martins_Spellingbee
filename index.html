<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <title>🐝 Oluwatosin Spelling Bee • Grades 1–3</title>
  <style>
    /* =========================================================
       CANDY POP THEME - Bouncy, Playful, Vibrant
       ========================================================= */
    :root {
      --pink: #FF4081;
      --pink-dark: #C60055;
      --pink-light: #FF80AB;
      --cyan: #00E5FF;
      --cyan-dark: #00B8D4;
      --yellow: #FFD740;
      --yellow-dark: #FFAB00;
      --green: #00E676;
      --green-dark: #00C853;
      --red: #FF5252;
      --red-dark: #D32F2F;
      --bg-1: #FFF0F5;
      --bg-2: #E0F7FA;
      --surface: #FFFFFF;
      --text-main: #2D1B36;
      --text-muted: #6A5075;
      --radius-xl: 36px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --shadow-candy: 0 8px 0 rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Fredoka', 'Baloo 2', cursive, sans-serif;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      min-height: 100vh;
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Floating Bubbles Background */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255, 64, 129, 0.15));
      border: 2px solid rgba(255, 255, 255, 0.6);
      animation: floatUp linear infinite;
      box-shadow: inset 0 -5px 10px rgba(255, 64, 129, 0.1);
    }
    .bubble.b1 { width: 80px; height: 80px; left: 10%; bottom: -100px; animation-duration: 12s; animation-delay: 0s; }
    .bubble.b2 { width: 50px; height: 50px; left: 30%; bottom: -100px; animation-duration: 15s; animation-delay: 3s; }
    .bubble.b3 { width: 110px; height: 110px; left: 60%; bottom: -120px; animation-duration: 18s; animation-delay: 1s; }
    .bubble.b4 { width: 60px; height: 60px; left: 80%; bottom: -100px; animation-duration: 14s; animation-delay: 5s; }
    .bubble.b5 { width: 90px; height: 90px; left: 45%; bottom: -100px; animation-duration: 20s; animation-delay: 8s; }

    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-110vh) translateX(20px) scale(1.1); opacity: 0; }
    }

    .app-container {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-family: 'Baloo 2', cursive;
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--pink), var(--cyan), var(--yellow));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      filter: drop-shadow(3px 3px 0px rgba(255, 64, 129, 0.2));
    }
    .header h1 span.bee {
      display: inline-block;
      animation: beeWiggle 2s ease-in-out infinite;
      -webkit-text-fill-color: initial; /* Keep emoji color */
    }
    @keyframes beeWiggle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(-15deg); }
      75% { transform: translateY(-3px) rotate(15deg); }
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: var(--surface);
      border: 3px solid var(--pink-light);
      color: var(--text-muted);
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 0 var(--pink-light);
      font-family: inherit;
    }
    .tab-btn:hover { transform: translateY(-3px); }
    .tab-btn:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 0 0 var(--pink-light);
    }
    .tab-btn.active {
      background: var(--pink);
      color: white;
      border-color: var(--pink-dark);
      box-shadow: 0 6px 0 var(--pink-dark);
    }
    .tab-btn.active:active { box-shadow: 0 0 0 var(--pink-dark); }

    /* Grade Badges */
    .grade-badge {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .grade-btn {
      background: var(--surface);
      border: 3px solid var(--yellow);
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.6rem 1.2rem;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 0 var(--yellow-dark);
      font-family: inherit;
    }
    .grade-btn:hover { transform: translateY(-3px); }
    .grade-btn:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 0 0 var(--yellow-dark);
    }
    .grade-btn.active {
      background: var(--yellow);
      color: var(--text-main);
      border-color: var(--yellow-dark);
      box-shadow: 0 6px 0 var(--yellow-dark);
    }
    .grade-btn.active:active { box-shadow: 0 0 0 var(--yellow-dark); }
    
    .count-badge {
      font-size: 0.85rem;
      font-weight: 800;
      background: var(--text-main);
      color: var(--yellow);
      padding: 2px 10px;
      border-radius: 14px;
    }
    .grade-btn.active .count-badge {
      background: var(--surface);
      color: var(--text-main);
    }

    /* Cards */
    .card-area {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 2rem 1.5rem;
      box-shadow: 0 12px 24px rgba(255, 64, 129, 0.1);
      margin-bottom: 1.5rem;
      border: 4px solid var(--pink-light);
      position: relative;
      overflow: hidden;
    }
    /* Playful dot pattern overlay */
    .card-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--pink-light) 2px, transparent 2px);
      background-size: 24px 24px;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Word Display */
    .word-display {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }
    .word {
      font-family: 'Baloo 2', cursive;
      font-size: 4.2rem;
      font-weight: 800;
      color: var(--pink);
      text-transform: uppercase;
      letter-spacing: 3px;
      word-break: break-word;
      line-height: 1.2;
      margin-bottom: 1rem;
      text-shadow: 4px 4px 0px var(--pink-light);
    }
    .word.pop {
      animation: wordBounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes wordBounceIn {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.15) rotate(5deg); opacity: 1; }
      70% { transform: scale(0.95) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .hint {
      font-size: 1.2rem;
      color: var(--text-muted);
      background: var(--bg-2);
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      border: 3px solid var(--cyan);
      box-shadow: 0 4px 0 var(--cyan-dark);
    }

    /* Speaker Big */
    .speaker-big {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--cyan);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      cursor: pointer;
      user-select: none;
      border: 4px solid var(--cyan-dark);
      box-shadow: 0 8px 0 var(--cyan-dark);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      margin: 0.5rem 0 1.5rem;
      z-index: 1;
    }
    .speaker-big:hover { transform: translateY(-3px); }
    .speaker-big:active {
      transform: translateY(6px) scale(0.95);
      box-shadow: 0 0 0 var(--cyan-dark);
    }
    .speaker-big.speaking {
      animation: speakerPulse 0.8s infinite;
      background: var(--pink);
      border-color: var(--pink-dark);
      box-shadow: 0 8px 0 var(--pink-dark);
    }
    @keyframes speakerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Spell Inputs */
    .spell-area {
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .spell-instruction {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .dash-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 1.5rem 0;
    }
    .dash-input {
      width: 58px;
      height: 68px;
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      color: var(--text-main);
      background: var(--surface);
      border: 4px solid var(--pink-light);
      border-radius: var(--radius-md);
      outline: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 0 var(--pink-light);
      font-family: inherit;
    }
    .dash-input:focus {
      border-color: var(--pink);
      box-shadow: 0 8px 0 var(--pink-dark);
      transform: translateY(-4px);
    }
    .dash-input.filled {
      border-color: var(--cyan);
      background: var(--bg-2);
      color: var(--cyan-dark);
      box-shadow: 0 6px 0 var(--cyan-dark);
    }
    .dash-input.correct {
      border-color: var(--green);
      background: #E8F5E9;
      color: var(--green-dark);
      box-shadow: 0 6px 0 var(--green-dark);
      animation: correctJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dash-input.wrong {
      border-color: var(--red);
      background: #FFEBEE;
      color: var(--red-dark);
      box-shadow: 0 6px 0 var(--red-dark);
      animation: shakeWiggle 0.5s ease;
    }
    @keyframes correctJump {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-15px) scale(1.1); }
      60% { transform: translateY(-5px) scale(0.95); }
    }
    @keyframes shakeWiggle {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-3deg); }
      40% { transform: translateX(8px) rotate(3deg); }
      60% { transform: translateX(-6px) rotate(-2deg); }
      80% { transform: translateX(6px) rotate(2deg); }
    }

    /* Feedback */
    .feedback {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 1rem;
      min-height: 2.5rem;
      letter-spacing: 0.5px;
    }
    .feedback.correct { color: var(--green-dark); }
    .feedback.wrong { color: var(--red-dark); }
    .feedback.idle { color: var(--text-muted); }

    /* Hint Box */
    .spell-hint-box {
      display: inline-block;
      background: var(--bg-1);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-lg);
      font-size: 1.05rem;
      color: var(--text-main);
      margin-top: 0.5rem;
      max-width: 92%;
      line-height: 1.6;
      border: 3px dashed var(--pink-light);
      transition: all 0.3s ease;
    }
    .spell-hint-box.revealed {
      background: #FFF8E1;
      border-color: var(--yellow);
      border-style: solid;
      box-shadow: 0 6px 0 var(--yellow-dark);
      transform: translateY(-2px);
    }

    /* Buttons */
    .actions, .spell-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1.5rem 0 0.5rem;
      position: relative;
      z-index: 1;
    }
    .btn {
      border: 3px solid transparent;
      border-radius: 50px;
      height: 54px;
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-width: 120px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn:active { transform: translateY(5px) scale(0.96); }
    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      transform: translateY(5px) scale(0.96) !important;
    }

    .btn.speak {
      background: var(--pink);
      color: white;
      border-color: var(--pink-dark);
      box-shadow: 0 6px 0 var(--pink-dark);
    }
    .btn.speak:active { box-shadow: 0 0 0 var(--pink-dark); }

    .btn.check {
      background: var(--green);
      color: white;
      border-color: var(--green-dark);
      box-shadow: 0 6px 0 var(--green-dark);
      min-width: 140px;
    }
    .btn.check:active { box-shadow: 0 0 0 var(--green-dark); }

    .btn.prev, .btn.next {
      background: var(--surface);
      color: var(--text-main);
      border-color: var(--pink-light);
      box-shadow: 0 6px 0 var(--pink-light);
    }
    .btn.prev:active, .btn.next:active { box-shadow: 0 0 0 var(--pink-light); }

    .btn.shuffle {
      background: var(--yellow);
      color: var(--text-main);
      border-color: var(--yellow-dark);
      box-shadow: 0 6px 0 var(--yellow-dark);
    }
    .btn.shuffle:active { box-shadow: 0 0 0 var(--yellow-dark); }

    .btn.hint {
      background: var(--bg-2);
      color: var(--cyan-dark);
      border-color: var(--cyan);
      box-shadow: 0 6px 0 var(--cyan-dark);
    }
    .btn.hint:active { box-shadow: 0 0 0 var(--cyan-dark); }

    .btn.reset {
      background: #FFEBEE;
      color: var(--red-dark);
      border-color: #FFCDD2;
      box-shadow: 0 6px 0 #FFCDD2;
    }
    .btn.reset:active { box-shadow: 0 0 0 #FFCDD2; }

    /* Progress Area */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border-radius: 50px;
      padding: 1rem 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border: 4px solid var(--cyan);
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .progress-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--cyan-dark);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .progress-bar-bg {
      flex: 1;
      min-width: 160px;
      height: 20px;
      background: var(--bg-2);
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid var(--cyan-dark);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan));
      background-size: 200% 100%;
      border-radius: 20px;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      animation: gradientShift 3s linear infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* ⭐ BOUCNY POPPING STARS ⭐ */
    .stars {
      display: flex;
      gap: 6px;
      font-size: 1.8rem;
      line-height: 1;
    }
    .star {
      color: #E0E0E0;
      transition: color 0.2s;
      display: inline-block;
    }
    .star.filled {
      color: var(--yellow);
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 4px 0 rgba(255, 171, 0, 0.5);
      animation: starBouncePop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes starBouncePop {
      0% { 
        transform: scale(0) rotate(-180deg); 
        opacity: 0; 
      }
      50% { 
        transform: scale(1.5) rotate(15deg); 
        opacity: 1; 
      }
      70% { 
        transform: scale(0.85) rotate(-10deg); 
      }
      85% { 
        transform: scale(1.1) rotate(5deg); 
      }
      100% { 
        transform: scale(1) rotate(0deg); 
      }
    }
    /* Sparkle effect on star pop */
    .star.filled::after {
      content: '✨';
      position: absolute;
      font-size: 1rem;
      top: -10px;
      right: -10px;
      animation: sparkleFade 0.8s ease-out forwards;
      pointer-events: none;
    }
    @keyframes sparkleFade {
      0% { transform: scale(0) translateY(0); opacity: 1; }
      100% { transform: scale(1.5) translateY(-15px); opacity: 0; }
    }

    /* Word Bank */
    .word-list-toggle {
      text-align: right;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: var(--pink);
      cursor: pointer;
      font-weight: 700;
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .word-list-toggle:hover { 
      background: var(--pink-light); 
      color: white;
    }
    
    .word-bank {
      margin-top: 0.5rem;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1rem 1.2rem;
      font-size: 1rem;
      color: var(--text-main);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border: 4px solid var(--pink-light);
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 8px 20px rgba(255, 64, 129, 0.1);
    }
    .word-bank span {
      background: var(--bg-2);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      border: 2px solid var(--cyan);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .word-bank span:hover {
      transform: scale(1.1) rotate(-2deg);
      background: var(--cyan);
      color: white;
    }

    .hidden { display: none !important; }

    .footer-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -40px;
      z-index: 999;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 700px) {
      .header h1 { font-size: 1.8rem; }
      .word { font-size: 3rem; letter-spacing: 2px; text-shadow: 3px 3px 0px var(--pink-light); }
      .card-area { padding: 1.5rem 1rem; border-radius: 28px; }
      .btn { height: 50px; padding: 0 18px; font-size: 0.95rem; min-width: 100px; }
      .speaker-big { width: 80px; height: 80px; font-size: 2.2rem; }
      .hint { font-size: 1.05rem; }
      .tab-btn { padding: 0.7rem 1.5rem; font-size: 1rem; }
      .progress-text { font-size: 1rem; }
      .feedback { font-size: 1.3rem; }
    }
    @media (max-width: 480px) {
      .word { font-size: 2.4rem; letter-spacing: 1px; }
      .grade-btn { font-size: 0.95rem; padding: 0.5rem 1rem; }
      .btn { font-size: 0.85rem; padding: 0 14px; min-width: 90px; gap: 4px; }
      .speaker-big { width: 68px; height: 68px; font-size: 1.8rem; }
      .dash-input { width: 46px; height: 56px; font-size: 1.8rem; border-radius: 14px; }
      .dash-row { gap: 6px; }
      .feedback { font-size: 1.15rem; }
      .spell-instruction { font-size: 1.05rem; }
      .hint { font-size: 0.95rem; padding: 0.6rem 1.2rem; }
      .stars { font-size: 1.4rem; gap: 4px; }
    }
  </style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
</div>

<div class="app-container">
  <div class="header">
    <h1><span class="bee">🐝</span> Oluwatosin Spelling Bee <span class="bee">🐝</span></h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabStudy" data-tab="study">📖 Study</button>
    <button class="tab-btn" id="tabSpell" data-tab="spell">✍️ Spell</button>
  </div>

  <div class="grade-badge">
    <button class="grade-btn active" data-grade="1">Grade 1 <span class="count-badge" id="count1">0</span></button>
    <button class="grade-btn" data-grade="2">Grade 2 <span class="count-badge" id="count2">0</span></button>

  }

    const starsToFill = Math.round((currentPos / total) * 10);
    const starEls = starsContainer.children;
    for (let i = 0; i < starEls.length; i++) {
      // Only add 'filled' if it wasn't already, to re-trigger animation if needed, 
      // but for simple progress, just toggling is fine.
      const isFilled = i < starsToFill;
      if (isFilled && !starEls[i].classList.contains('filled')) {
        starEls[i].classList.add('filled');
      } else if (!isFilled) {
        starEls[i].classList.remove('filled');
      }
    }
  }

    toggleWordList.textContent = wordBankDiv.classList.contains('hidden')

      : '📋 hide word bank';
  }

  /* =========================================================
     SPEECH — Clearer pronunciation with syllable-by-syllable
     playback for longer words + high-quality American voice.
     ========================================================= */
  function stopSpeech() {
    speechSessionId += 1;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    isSpeaking = false;
    speakerBig.classList.remove('speaking');
    speakBtn.disabled = false;
    spellSpeakBtn.disabled = false;
  }

  function isSpeechSessionActive(sessionId) {
    return sessionId === speechSessionId;
  }

  function pauseBetween(ms, sessionId) {
    return new Promise((resolve) => {
      setTimeout(() => resolve(isSpeechSessionActive(sessionId)), ms);
    });
  }

  function pickAmericanVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return null;

    const topWestAfrican = [
      'Google Nigerian English', 'Google English (Nigeria)',
      'Microsoft Adeola Online (Natural) - English (Nigeria)',
      'Microsoft Abu Online (Natural) - English (Nigeria)',
      'Microsoft Nigerian English', 'English (Nigeria)', 'en-NG'
    ];
    for (const name of topWestAfrican) {
      const v = voices.find(v => v.name === name);
      if (v) return v;
    }
    const exactNG = voices.find(v => v.lang === 'en-NG' || v.lang === 'en_NG' || v.lang === 'en-NG-ng');
    if (exactNG) return exactNG;
    
    const topUS = [
      'Google US English', 'Microsoft Aria Online (Natural) - English (United States)',
      'Microsoft Jenny Online (Natural) - English (United States)',
      'Microsoft Guy Online (Natural) - English (United States)',
      'Microsoft Michelle Online (Natural) - English (United States)',
      'Microsoft Zira - English (United States)', 'Microsoft David - English (United States)',
      'Microsoft Mark - English (United States)', 'Samantha', 'Alex', 'Ava', 'Allison'
    ];
    for (const name of topUS) {
      const v = voices.find(v => v.name === name);
      if (v) return v;
    }
    const exactUS = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
    if (exactUS) return exactUS;
    const startsUS = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us'));
    if (startsUS) return startsUS;
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
  }

  function loadVoices() {
    preferredVoice = pickAmericanVoice();
  }

  function speakOnce(text, rate, pitch, onEnd, sessionId) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) return resolve();
      if (typeof sessionId === 'number' && !isSpeechSessionActive(sessionId)) {
        return resolve(false);
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      u.pitch = pitch || 1.0;
      u.volume = 1.0;
      if (!preferredVoice) preferredVoice = pickAmericanVoice();
      if (preferredVoice) u.voice = preferredVoice;
      u.onend = () => {
        if (onEnd && (!sessionId || isSpeechSessionActive(sessionId))) onEnd();
        resolve(typeof sessionId === 'number' ? isSpeechSessionActive(sessionId) : true);
      };
      u.onerror = () => resolve(false);
      window.speechSynthesis.speak(u);
    });
  }

  function syllabify(word) {
    const w = word.toUpperCase();
    if (w.length <= 4) return [w, w];
    const chunks = [];
    let cur = '';
    const vowels = 'AEIOUY';
    for (let i = 0; i < w.length; i++) {
      cur += w[i];
      const next = w[i + 1];
      const isVowel = vowels.includes(w[i]);
      const nextIsVowel = next ? vowels.includes(next) : false;
      if (isVowel && next && !nextIsVowel && cur.length >= 2 && i < w.length - 1) {
        chunks.push(cur);
        cur = '';
      }
    }
    if (cur) chunks.push(cur);
    if (chunks.length > 4) {
      const head = chunks.slice(0, 2);
      const middle = chunks.slice(2, chunks.length - 1).join('');
      const tail = chunks[chunks.length - 1];
      return [...head, middle, tail, w];
    }
    return [...chunks, w];
  }

  async function speakWordClearly() {
    const item = wordsList[currentIndex];
    if (!item) return;

    stopSpeech();
    const sessionId = speechSessionId;
    isSpeaking = true;
    speakerBig.classList.add('speaking');
    spellSpeakBtn.disabled = true;

    const word = item.word.toUpperCase();
    const warmedUp = await speakOnce(' ', 0.5, 1.0, null, sessionId);
    if (!warmedUp) return;

    if (currentGrade === 1) {
      const parts = syllabify(word);
      for (let i = 0; i < parts.length; i++) {
        const spoke = await speakOnce(parts[i], 0.5, 1.0, null, sessionId);
        if (!spoke) return;
        if (i < parts.length - 1) {
          const keepGoing = await pauseBetween(350, sessionId);
          if (!keepGoing) return;
        }
      }
    } else {
      const spoke = await speakOnce(word, 0.6, 1.0, null, sessionId);
      if (!spoke) return;
    }

    if (!isSpeechSessionActive(sessionId)) return;
    isSpeaking = false;
    speakerBig.classList.remove('speaking');
    spellSpeakBtn.disabled = false;
  }

  async function speakStudyWord() {
    const item = wordsList[currentIndex];
    if (!item) return;

    stopSpeech();
    const sessionId = speechSessionId;
    isSpeaking = true;
    speakerBig.classList.add('speaking');
    speakBtn.disabled = true;

    const word = item.word.toUpperCase();
    const len = word.length;

    const wordRate   = len > 8 ? 0.55 : 0.7;
    const letterRate = len > 8 ? 0.45 : 0.55;
    const wordPause  = len > 8 ? 700 : 500;
    const letterPause= len > 8 ? 450 : 300;

    const warmedUp = await speakOnce(' ', 0.5, 1.0, null, sessionId);
    if (!warmedUp) return;

    for (let rep = 0; rep < 3; rep++) {
      const spokeWord = await speakOnce(word, wordRate, 1.0, null, sessionId);
      if (!spokeWord) return;
      const keepGoingAfterWord = await pauseBetween(wordPause, sessionId);
      if (!keepGoingAfterWord) return;
      
      for (const ch of word) {
        const spokeLetter = await speakOnce(ch, letterRate, 1.0, null, sessionId);
        if (!spokeLetter) return;
        const keepGoingAfterLetter = await pauseBetween(letterPause, sessionId);
        if (!keepGoingAfterLetter) return;
      }
      if (rep < 2) {
        const keepGoingBeforeNextRepeat = await pauseBetween(800, sessionId);
        if (!keepGoingBeforeNextRepeat) return;
      }
    }

    if (!isSpeechSessionActive(sessionId)) return;
    isSpeaking = false;
    speakerBig.classList.remove('speaking');
    speakBtn.disabled = false;
  }

  function speakPraise(text) {
    stopSpeech();
    speakOnce(text, 0.75, 1.0);
  }

  function speakCurrentWord() {
    speakWordClearly();
  }

  /* ---------- Navigation ---------- */
  function nextWord() {
    if (!wordsList.length) return;
    currentIndex = (currentIndex + 1) % wordsList.length;
    renderWord();
    updateProgress();
    resetSpellInputs();
  }

  function prevWord() {
    if (!wordsList.length) return;
    currentIndex = (currentIndex - 1 + wordsList.length) % wordsList.length;
    renderWord();
    updateProgress();
    resetSpellInputs();
  }

  function shuffleWords() {
    if (!wordsList.length) return;
    for (let i = wordsList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [wordsList[i], wordsList[j]] = [wordsList[j], wordsList[i]];
    }
    currentIndex = 0;
    shuffled = true;
    renderWord();
    updateProgress();
    buildWordBank();
    stopSpeech();
    resetSpellInputs();
  }

  function resetProgress() {
    currentIndex = 0;
    if (shuffled) {
      wordsList = WORDS[currentGrade].slice();
      shuffled = false;
      buildWordBank();
    }
    renderWord();
    updateProgress();
    stopSpeech();
    resetSpellInputs();
  }

  /* ---------- SPELL TAB ---------- */
  function resetSpellInputs() {
    feedback.textContent = '\u00A0';
    feedback.className = 'feedback idle';
    spellHintBox.textContent = '💡 Click "Hint" to hear the word again and get a clue';
    spellHintBox.classList.remove('revealed');
    buildDashInputs();
  }

  function buildDashInputs() {
    const item = wordsList[currentIndex];
    if (!item) return;
    const len = item.word.length;
    dashRow.innerHTML = '';
    for (let i = 0; i < len; i++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 1;
      input.className = 'dash-input';
      input.autocomplete = 'off';
      input.autocapitalize = 'characters';
      input.spellcheck = false;
      input.setAttribute('aria-label', `Letter ${i+1}`);
      input.addEventListener('input', (e) => {
        const v = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
        e.target.value = v;
        e.target.classList.toggle('filled', v.length === 1);
        if (v.length === 1) {
          const next = dashRow.children[i + 1];
          if (next) next.focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value) {
          const prev = dashRow.children[i - 1];
          if (prev) { prev.focus(); prev.value = ''; prev.classList.remove('filled'); }
        }
        if (e.key === 'ArrowLeft' && i > 0) dashRow.children[i-1].focus();
        if (e.key === 'ArrowRight' && i < len - 1) dashRow.children[i+1].focus();
        if (e.key === 'Enter') { e.preventDefault(); checkSpelling(); }
      });
      dashRow.appendChild(input);
    }
    setTimeout(() => { if (dashRow.children[0]) dashRow.children[0].focus(); }, 50);
  }

  function readSpelling() {
    let out = '';
    for (const inp of dashRow.children) {
      out += (inp.value || '').toUpperCase();
    }
    return out;
  }

  function checkSpelling() {
    const item = wordsList[currentIndex];
    if (!item) return;
    const target = item.word.toUpperCase();
    const attempt = readSpelling();

    if (attempt.length < target.length) {
      feedback.textContent = `✏️ Fill all ${target.length} boxes!`;
      feedback.className = 'feedback wrong';
      speakOnce("Please fill all the letters, Oluwatosin.", 0.7, 1.0);
      return;
    }

    if (attempt === target) {
      for (const inp of dashRow.children) inp.classList.add('correct');
      feedback.textContent = '🌟 Brilliant Oluwatosin! 🌟';
      feedback.className = 'feedback correct';
      speakPraise("Brilliant Oluwatosin!");
      launchConfetti();
    } else {
      for (const inp of dashRow.children) inp.classList.add('wrong');
      feedback.textContent = '💪 You can do it Oluwatosin, try again!';
      feedback.className = 'feedback wrong';
      speakPraise("You can do it Oluwatosin, try again.");
      setTimeout(() => {
        for (const inp of dashRow.children) inp.classList.remove('wrong');
      }, 1200);
    }
  }

  function showSpellHint() {
    const item = wordsList[currentIndex];
    if (!item) return;
    const word = item.word.toUpperCase();
    spellHintBox.innerHTML =
      `💡 <strong>Meaning:</strong> ${item.hint}<br>` +
      `🔤 <strong>Starts with:</strong> "${word[0]}" &nbsp;•&nbsp; ` +
      `<strong>Letters:</strong> ${word.length} &nbsp;•&nbsp; ` +
      `<strong>Ends with:</strong> "${word[word.length - 1]}"`;
    spellHintBox.classList.add('revealed');
    speakWordClearly();
  }

  /* ---------- Tab switching ---------- */
  function switchTab(tab) {
    currentTab = tab;
    tabStudy.classList.toggle('active', tab === 'study');
    tabSpell.classList.toggle('active', tab === 'spell');
    studyPanel.classList.toggle('hidden', tab !== 'study');
    spellPanel.classList.toggle('hidden', tab !== 'spell');
    stopSpeech();
    if (tab === 'spell') {
      resetSpellInputs();
      setTimeout(() => speakWordClearly(), 350);
    }
  }

  function updateCountBadges() {
    for (const g of [1,2,3]) {
      countBadges[g].textContent = WORDS[g].length;
    }
  }

  function launchConfetti() {
    const emojis = ['🎉','⭐','🌈','✨','🎈','🐝','🍬','🍭','🧁'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      c.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  /* ---------- Init ---------- */
  function init() {
    buildStars();
    updateCountBadges();
    loadGrade(1);

    tabStudy.addEventListener('click', () => switchTab('study'));
    tabSpell.addEventListener('click', () => switchTab('spell'));

    gradeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const g = parseInt(e.currentTarget.dataset.grade, 10);
        if (g === currentGrade) return;
        loadGrade(g);
      });
    });

    speakBtn.addEventListener('click', speakStudyWord);
    prevBtn.addEventListener('click', () => { prevWord(); speakStudyWord(); });
    nextBtn.addEventListener('click', () => { nextWord(); speakStudyWord(); });
    shuffleBtn.addEventListener('click', () => { shuffleWords(); speakStudyWord(); });
    resetBtn.addEventListener('click', resetProgress);

    speakerBig.addEventListener('click', speakCurrentWord);
    spellSpeakBtn.addEventListener('click', speakCurrentWord);
    spellHintBtn.addEventListener('click', showSpellHint);
    spellCheckBtn.addEventListener('click', checkSpelling);
    spellPrevBtn.addEventListener('click', prevWord);
    spellNextBtn.addEventListener('click', () => {
      nextWord();
      setTimeout(() => speakWordClearly(), 300);
    });
    spellResetBtn.addEventListener('click', resetProgress);

    toggleWordList.addEventListener('click', toggleWordBank);

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 250);
      setTimeout(loadVoices, 1000);
    }

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement.tagName;
      if (currentTab === 'study') {
        if (e.code === 'Space' && !e.repeat && tag !== 'BUTTON' && tag !== 'INPUT') {
          e.preventDefault();
          speakStudyWord();
        }
        if (e.code === 'ArrowRight') { e.preventDefault(); nextWord(); }
        if (e.code === 'ArrowLeft')  { e.preventDefault(); prevWord(); }
        if (e.code === 'Home')       { e.preventDefault(); resetProgress(); }
      }
      if (currentTab === 'spell') {
        if (e.code === 'Space' && !e.repeat && tag !== 'INPUT') {
          e.preventDefault();
          speakCurrentWord();
        }
        if (e.code === 'ArrowLeft' && tag !== 'INPUT')  { e.preventDefault(); prevWord(); }
        if (e.code === 'ArrowRight' && tag !== 'INPUT') { e.preventDefault(); nextWord(); }
        if (e.code === 'Home')                          { e.preventDefault(); resetProgress(); }
      }
    });
  }

  init();
})();
</script>
