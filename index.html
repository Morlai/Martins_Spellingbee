<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

  <title>Spelling Bee • Grades 1–3</title>

  <style>
    :root{
      --bg1:#0B1020;
      --bg2:#111B3A;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.12);
      --stroke: rgba(255,255,255,.18);

      --text:#EAF2FF;
      --muted: rgba(234,242,255,.75);

      --pink:#FF4D9D;
      --pink2:#FF7CC0;
      --cyan:#27E6FF;
      --yellow:#FFD84D;
      --green:#2EF58A;
      --red:#FF4B4B;

      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --shadow2: 0 10px 30px rgba(0,0,0,.22);

      --r-xl: 28px;
      --r-lg: 20px;
      --r-md: 14px;

      --ease: cubic-bezier(.2,.9,.2,1);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:'Fredoka','Baloo 2',cursive,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(39,230,255,.25), transparent 60%),
        radial-gradient(900px 500px at 85% 15%, rgba(255,77,157,.22), transparent 55%),
        radial-gradient(900px 700px at 60% 95%, rgba(255,216,77,.16), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
      -webkit-tap-highlight-color:transparent;
    }

    /* Background decor */
    .bg-decor{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
      opacity:.9;
    }
    .bubble{
      position:absolute;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,77,157,.12));
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: inset 0 -10px 25px rgba(255,77,157,.10);
      animation: floatUp linear infinite;
      filter: blur(.1px);
    }
    .b1{ width:110px; height:110px; left:7%;  bottom:-140px; animation-duration:13s; animation-delay:0s; }
    .b2{ width:70px;  height:70px;  left:28%; bottom:-120px; animation-duration:16s; animation-delay:2.5s; }
    .b3{ width:150px; height:150px; left:62%; bottom:-170px; animation-duration:19s; animation-delay:1s; }
    .b4{ width:85px;  height:85px;  left:82%; bottom:-140px; animation-duration:15s; animation-delay:5s; }
    .b5{ width:120px; height:120px; left:45%; bottom:-160px; animation-duration:21s; animation-delay:8s; }

    @keyframes floatUp{
      0%{ transform: translateY(0) translateX(0) scale(1); opacity:0;}
      10%{ opacity:1;}
      90%{ opacity:1;}
      100%{ transform: translateY(-115vh) translateX(18px) scale(1.12); opacity:0;}
    }

    /* App container */
    .app{
      position:relative;
      z-index:1;
      max-width: 980px;
      margin:0 auto;
      padding: 24px 16px 40px;
    }

    /* Header */
    .header{
      text-align:center;
      margin: 10px 0 18px;
    }
    .title{
      font-family:'Baloo 2',cursive;
      font-size: clamp(1.6rem, 3.2vw, 2.6rem);
      font-weight: 900;
      letter-spacing:.2px;
      display:inline-flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,77,157,.18), rgba(39,230,255,.14));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
    }
    .bee{
      display:inline-block;
      animation: beeWiggle 2s var(--ease) infinite;
      transform-origin:50% 80%;
    }
    @keyframes beeWiggle{
      0%,100%{ transform: translateY(0) rotate(0deg); }
      25%{ transform: translateY(-8px) rotate(-14deg); }
      75%{ transform: translateY(-4px) rotate(14deg); }
    }

    /* Top controls */
    .tabs{
      display:flex;
      justify-content:center;
      gap:12px;
      margin: 10px 0 18px;
      flex-wrap:wrap;
    }
    .pill{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1.05rem;
      cursor:pointer;
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      user-select:none;
      font-weight:800;
      display:inline-flex;
      gap:10px;
      align-items:center;
    }
    .pill:hover{ transform: translateY(-3px); background: rgba(255,255,255,.08); }
    .pill:active{ transform: translateY(4px) scale(.98); }
    .pill.active{
      color: var(--text);
      border-color: rgba(255,255,255,.30);
      background: linear-gradient(135deg, rgba(255,77,157,.24), rgba(39,230,255,.16));
    }

    /* Grade chips */
    .grades{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }
    .chip{
      border-radius:999px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      cursor:pointer;
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
      font-weight:900;
      display:inline-flex;
      gap:10px;
      align-items:center;
      user-select:none;
    }
    .chip:hover{ transform: translateY(-3px); }
    .chip:active{ transform: translateY(4px) scale(.98); }
    .chip.active{
      color: var(--text);
      border-color: rgba(255,255,255,.32);
      background: linear-gradient(135deg, rgba(255,216,77,.22), rgba(46,245,138,.14));
    }
    .chip .count{
      font-size:.9rem;
      font-weight:900;
      padding: 3px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,216,77,.95);
    }
    .chip.active .count{ color: var(--text); background: rgba(255,255,255,.12); }

    /* Card panels */
    .panel{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow:hidden;
      position:relative;
    }
    .panel::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(600px 300px at 20% 0%, rgba(255,77,157,.22), transparent 60%),
        radial-gradient(600px 300px at 80% 0%, rgba(39,230,255,.18), transparent 60%);
      opacity:.8;
      pointer-events:none;
    }
    .panel-inner{
      position:relative;
      padding: 18px 18px 20px;
    }

    /* Word display */
    .word-wrap{
      text-align:center;
      margin-bottom:14px;
    }
    .word{
      font-family:'Baloo 2',cursive;
      font-size: clamp(2.2rem, 5vw, 4.3rem);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(90deg, var(--pink), var(--cyan), var(--yellow));
      -webkit-background-clip:text;
      background-clip:text;
      text-shadow: 0 10px 30px rgba(255,77,157,.18);
      animation: wordPop .6s var(--ease) both;
      word-break: break-word;
      line-height: 1.15;
      margin-bottom:10px;
    }
    @keyframes wordPop{
      0%{ transform: scale(.85) rotate(-2deg); opacity:0;}
      60%{ transform: scale(1.06) rotate(2deg); opacity:1;}
      100%{ transform: scale(1) rotate(0deg); opacity:1;}
    }

    .hint{
      display:inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-weight: 800;
      max-width: 95%;
      line-height:1.3;
    }

    /* Buttons */
    .row{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top: 14px;
    }
    .btn{
      height: 54px;
      min-width: 140px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor:pointer;
      font-weight: 900;
      letter-spacing:.4px;
      text-transform: uppercase;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      user-select:none;
    }
    .btn:hover{ transform: translateY(-3px); background: rgba(255,255,255,.09); }
    .btn:active{ transform: translateY(4px) scale(.98); }
    .btn:disabled{ opacity:.45; pointer-events:none; transform: translateY(2px) scale(.98); }

    .btn.speak{
      background: linear-gradient(135deg, rgba(255,77,157,.75), rgba(255,77,157,.30));
      border-color: rgba(255,77,157,.65);
    }
    .btn.check{
      background: linear-gradient(135deg, rgba(46,245,138,.75), rgba(46,245,138,.25));
      border-color: rgba(46,245,138,.55);
      min-width: 160px;
    }
    .btn.primary{
      background: linear-gradient(135deg, rgba(39,230,255,.55), rgba(39,230,255,.18));
      border-color: rgba(39,230,255,.45);
    }
    .btn.warn{
      background: linear-gradient(135deg, rgba(255,216,77,.55), rgba(255,216,77,.18));
      border-color: rgba(255,216,77,.45);
    }
    .btn.danger{
      background: rgba(255,75,75,.18);
      border-color: rgba(255,75,75,.35);
    }
    .btn.ghost{ min-width: 120px; }

    /* Spell inputs */
    .spell-instruction{
      font-weight:900;
      color: var(--muted);
      text-align:center;
      margin: 2px 0 12px;
    }
    .speaker-big{
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(39,230,255,.20);
      color: white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 2.5rem;
      cursor:pointer;
      margin: 6px auto 12px;
      box-shadow: 0 18px 40px rgba(39,230,255,.18);
      transition: transform .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .speaker-big::after{
      content:"";
      position:absolute; inset:-40%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 60%);
      transform: rotate(20deg);
      opacity:.7;
    }
    .speaker-big:hover{ transform: translateY(-3px); background: rgba(39,230,255,.26); }
    .speaker-big:active{ transform: translateY(4px) scale(.98); }
    .speaker-big.speaking{
      background: rgba(255,77,157,.22);
      border-color: rgba(255,77,157,.35);
      box-shadow: 0 18px 50px rgba(255,77,157,.18);
      animation: speakPulse .8s ease-in-out infinite;
    }
    @keyframes speakPulse{
      0%,100%{ transform: translateY(0) scale(1); }
      50%{ transform: translateY(-2px) scale(1.06); }
    }

    .dash-row{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin: 14px 0 10px;
      padding: 4px;
    }
    .dash-input{
      width: 54px;
      height: 64px;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,.20);
      background: rgba(0,0,0,.16);
      color: var(--text);
      font-size: 2rem;
      font-weight:900;
      text-transform:uppercase;
      text-align:center;
      outline:none;
      transition: transform .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
      caret-color: transparent;
    }
    .dash-input:focus{
      border-color: rgba(39,230,255,.85);
      box-shadow: 0 0 0 6px rgba(39,230,255,.18), 0 18px 45px rgba(0,0,0,.22);
      transform: translateY(-3px);
      background: rgba(39,230,255,.08);
    }
    .dash-input.filled{
      border-color: rgba(39,230,255,.55);
      background: rgba(39,230,255,.12);
    }
    .dash-input.correct{
      border-color: rgba(46,245,138,.85);
      background: rgba(46,245,138,.14);
      animation: correctJump .45s var(--ease);
    }
    .dash-input.wrong{
      border-color: rgba(255,75,75,.85);
      background: rgba(255,75,75,.14);
      animation: shake .45s ease;
    }
    @keyframes correctJump{
      0%,100%{ transform: translateY(0); }
      40%{ transform: translateY(-12px) scale(1.07); }
      70%{ transform: translateY(-4px) scale(.98); }
    }
    @keyframes shake{
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-7px) rotate(-2deg); }
      40%{ transform: translateX(7px) rotate(2deg); }
      60%{ transform: translateX(-5px) rotate(-1deg); }
      80%{ transform: translateX(5px) rotate(1deg); }
    }

    /* Feedback + hint box */
    .feedback{
      margin-top: 10px;
      text-align:center;
      font-weight: 900;
      min-height: 28px;
      letter-spacing:.2px;
      color: var(--muted);
    }
    .feedback.correct{ color: rgba(46,245,138,.95); }
    .feedback.wrong{ color: rgba(255,75,75,.95); }
    .spell-hint-box{
      margin: 12px auto 2px;
      display:block;
      max-width: 95%;
      padding: 12px 16px;
      border-radius: 18px;
      border: 1px dashed rgba(255,77,157,.45);
      background: rgba(0,0,0,.14);
      color: var(--text);
      font-weight: 800;
      line-height:1.45;
      text-align:left;
      transition: all .25s var(--ease);
    }
    .spell-hint-box.revealed{
      border-style: solid;
      background: rgba(255,216,77,.12);
      border-color: rgba(255,216,77,.6);
      box-shadow: 0 16px 40px rgba(255,216,77,.10);
      transform: translateY(-2px);
    }

    /* Progress */
    .progress{
      margin-top: 16px;
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .progress-card{
      flex: 1;
      min-width: 260px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 10px 14px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
    }
    .progress-text{
      font-weight: 950;
      color: rgba(39,230,255,.95);
      white-space:nowrap;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .bar-bg{
      flex:1;
      height: 16px;
      border-radius: 999px;
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(255,255,255,.16);
      overflow:hidden;
      min-width: 180px;
    }
    .bar-fill{
      height:100%;
      width:10%;
      border-radius:999px;
      background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan));
      background-size: 200% 100%;
      transition: width .45s var(--ease);
      animation: gradientShift 3.2s linear infinite;
      position:relative;
    }
    @keyframes gradientShift{
      0%{ background-position: 0% 50%;}
      100%{ background-position: 200% 50%;}
    }

    /* Stars */
    .stars{
      display:flex; gap:6px;
      padding: 10px 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
    }
    .star{
      font-size: 1.6rem;
      color: rgba(255,255,255,.35);
      position:relative;
      display:inline-block;
      transition: color .18s var(--ease);
      line-height:1;
    }
    .star.filled{
      color: rgba(255,216,77,.98);
      text-shadow: 0 0 20px rgba(255,216,77,.28);
      animation: starPop .6s var(--ease) both;
    }
    @keyframes starPop{
      0%{ transform: scale(.2) rotate(-20deg); opacity:0; }
      60%{ transform: scale(1.2) rotate(8deg); opacity:1; }
      100%{ transform: scale(1) rotate(0deg); opacity:1; }
    }

    /* Word bank drawer */
    .bank-wrap{
      margin-top: 10px;
      display:flex;
      justify-content:flex-end;
    }
    .toggle{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      cursor:pointer;
      user-select:none;
      font-weight:900;
      display:inline-flex;
      gap:10px;
      align-items:center;
      transition: transform .18s var(--ease), background .18s var(--ease);
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 40px rgba(0,0,0,.18);
    }
    .toggle:hover{ transform: translateY(-3px); background: rgba(255,255,255,.09); }
    .toggle:active{ transform: translateY(4px) scale(.98); }

    .word-bank{
      margin-top: 10px;
      max-height: 0px;
      overflow:hidden;
      transition: max-height .35s var(--ease);
      border-radius: var(--r-lg);
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 40px rgba(0,0,0,.18);
    }
    .word-bank.open{ max-height: 260px; padding: 14px; }
    .word-bank-grid{
      display:flex; flex-wrap:wrap;
      gap:10px;
      padding: 4px 2px;
    }
    .word-chip{
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 900;
      color: rgba(234,242,255,.92);
      transition: transform .16s var(--ease), background .16s var(--ease), border-color .16s var(--ease);
      user-select:none;
    }
    .word-chip:hover{
      transform: translateY(-2px);
      background: rgba(39,230,255,.12);
      border-color: rgba(39,230,255,.35);
    }

    .footer{
      text-align:center;
      margin-top: 18px;
      color: var(--muted);
      font-weight: 800;
    }

    .hidden{ display:none !important; }

    /* Confetti */
    .confetti{
      position:fixed;
      top:-40px;
      z-index:9999;
      pointer-events:none;
      animation: confettiFall linear forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
      font-weight: 900;
    }
    @keyframes confettiFall{
      0%{ transform: translateY(0) rotate(0deg); opacity:1; }
      100%{ transform: translateY(115vh) rotate(720deg); opacity:0; }
    }

    /* Responsive */
    @media (max-width: 520px){
      .btn{ min-width: 110px; height: 50px; padding:0 14px; }
      .dash-input{ width: 46px; height: 56px; font-size: 1.75rem; border-radius: 14px; }
      .speaker-big{ width: 82px; height: 82px; font-size: 2.2rem; }
      .progress-card{ padding: 10px 10px; }
    }
  </style>
</head>

<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
  </div>

  <div class="app">
    <div class="header">
      <div class="title">
        <span class="bee">🐝</span>
        Spelling Bee • Grades 1–3
        <span class="bee">🐝</span>
      </div>
    </div>

    <div class="tabs">
      <button class="pill active" id="tabStudy" data-tab="study">📖 Study</button>
      <button class="pill" id="tabSpell" data-tab="spell">✍️ Spell</button>
    </div>

    <div class="grades">
      <button class="chip active" data-grade="1">Grade 1 <span class="count" id="count1">0</span></button>
      <button class="chip" data-grade="2">Grade 2 <span class="count" id="count2">0</span></button>
      <button class="chip" data-grade="3">Grade 3 <span class="count" id="count3">0</span></button>
    </div>

    <!-- STUDY -->
    <div id="studyPanel" class="panel">
      <div class="panel-inner">
        <div class="word-wrap">
          <div class="word" id="wordDisplay">PAT</div>
          <div class="hint" id="hintDisplay">tap lightly with your hand</div>
        </div>

        <div class="row">
          <button class="btn speak" id="speakBtn">🔊 Speak</button>
          <button class="btn ghost" id="prevBtn">⬅️ Previous</button>
          <button class="btn ghost" id="nextBtn">➡️ Next</button>
          <button class="btn warn" id="shuffleBtn">🔀 Shuffle</button>
          <button class="btn danger" id="resetBtn">🔄 Reset</button>
        </div>
      </div>
    </div>

    <!-- SPELL -->
    <div id="spellPanel" class="panel hidden">
      <div class="panel-inner">
        <div class="spell-instruction">🔊 Listen carefully, then spell the word:</div>

        <div class="speaker-big" id="speakerBig" title="Click to hear the word again">🔊</div>

          s.className = "star";

      function updateProgress() {
        const total = wordsList.length || 1;
        const currentPos = currentIndex + 1;

        progressLabel.textContent = `${currentPos} / ${total}`;
        progressFill.style.width = `${(currentPos / total) * 100}%`;

        const starsToFill = Math.round((currentPos / total) * 10);
        const starEls = starsContainer.children;

        for (let i = 0; i < starEls.length; i++) {
          const isFilled = i < starsToFill;
          starEls[i].classList.toggle("filled", isFilled);
        }
      }

        wordDisplay.textContent = item.word;
        hintDisplay.textContent = item.hint;

        wordDisplay.classList.remove("word");
        // Force reflow via offsetHeight
        void wordDisplay.offsetHeight;
        // Re-add base class by keeping same element; simplest: just reapply animation
        wordDisplay.style.animation = "none";
        void wordDisplay.offsetWidth;
        wordDisplay.style.animation = "";
      }

          const v = voices.find(v => v.name === name);
          if (v) return v;
        }

        const exactNG = voices.find(v =>
          v.lang === "en-NG" || v.lang === "en_NG" || v.lang === "en-NG-ng"
        );
        if (exactNG) return exactNG;

        const topUS = [
          "Google US English",
          "Microsoft Aria Online (Natural) - English (United States)",
          "Microsoft Jenny Online (Natural) - English (United States)",
          "Microsoft Guy Online (Natural) - English (United States)",
          "Microsoft Michelle Online (Natural) - English (United States)",
          "Microsoft Zira - English (United States)",
          "Microsoft David - English (United States)",
          "Microsoft Mark - English (United States)",
          "Samantha","Alex","Ava","Allison"
        ];
        for (const name of topUS) {
          const v = voices.find(v => v.name === name);
          if (v) return v;
        }

        const exactUS = voices.find(v => v.lang === "en-US" || v.lang === "en_US");
        if (exactUS) return exactUS;

        const startsUS = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en-us"));
        if (startsUS) return startsUS;

        return voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || null;
      }

      function loadVoices() {
        preferredVoice = pickAmericanVoice();
      }

      function speakOnce(text, rate, pitch, onEnd, sessionId) {
        return new Promise(resolve => {
          if (!("speechSynthesis" in window)) return resolve();
          if (typeof sessionId === "number" && !isSpeechSessionActive(sessionId)) return resolve(false);

          const u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          u.rate = rate;
          u.pitch = pitch ?? 1.0;
          u.volume = 1.0;

          if (!preferredVoice) preferredVoice = pickAmericanVoice();
          if (preferredVoice) u.voice = preferredVoice;

          u.onend = () => {
            if (onEnd && (!sessionId || isSpeechSessionActive(sessionId))) onEnd();
            resolve(typeof sessionId === "number" ? isSpeechSessionActive(sessionId) : true);
          };
          u.onerror = () => resolve(false);

          window.speechSynthesis.speak(u);
        });
      }

      function syllabify(word) {
        const w = word.toUpperCase();
        if (w.length <= 4) return [w, w];

        const chunks = [];
        let cur = "";
        const vowels = "AEIOUY";

        for (let i = 0; i < w.length; i++) {
          cur += w[i];
          const next = w[i + 1];
          const isVowel = vowels.includes(w[i]);
          const nextIsVowel = next ? vowels.includes(next) : false;

          if (isVowel && next && !nextIsVowel && cur.length >= 2 && i < w.length - 1) {
            chunks.push(cur);
            cur = "";
          }
        }
        if (cur) chunks.push(cur);

        if (chunks.length > 4) {
          const head = chunks.slice(0, 2);
          const middle = chunks.slice(2, chunks.length - 1).join("");
          const tail = chunks[chunks.length - 1];
          return [...head, middle, tail, w];
        }
        return [...chunks, w];
      }

      async function speakWordClearly() {
        const item = wordsList[currentIndex];
        if (!item) return;

        stopSpeech();
        const sessionId = speechSessionId;

        isSpeaking = true;
        speakerBig.classList.add("speaking");
        spellSpeakBtn.disabled = true;

        const word = item.word.toUpperCase();
        const warmedUp = await speakOnce(" ", 0.5, 1.0, null, sessionId);
        if (!warmedUp) return;

        if (currentGrade === 1) {
          const parts = syllabify(word);
          for (let i = 0; i < parts.length; i++) {
            const ok = await speakOnce(parts[i], 0.5, 1.0, null, sessionId);
            if (!ok) return;
            if (i < parts.length - 1) {
              const keep = await pauseBetween(350, sessionId);
              if (!keep) return;
            }
          }
        } else {
          const ok = await speakOnce(word, 0.6, 1.0, null, sessionId);
          if (!ok) return;
        }

        if (!isSpeechSessionActive(sessionId)) return;
        isSpeaking = false;
        speakerBig.classList.remove("speaking");
        spellSpeakBtn.disabled = false;
      }

      async function speakStudyWord() {
        const item = wordsList[currentIndex];
        if (!item) return;

        stopSpeech();
        const sessionId = speechSessionId;

        isSpeaking = true;
        speakerBig.classList.add("speaking");
        speakBtn.disabled = true;

        const word = item.word.toUpperCase();
        const len = word.length;

        const wordRate = len > 8 ? 0.55 : 0.7;
        const letterRate = len > 8 ? 0.45 : 0.55;
        const wordPause = len > 8 ? 700 : 500;
        const letterPause = len > 8 ? 450 : 300;

        const warmedUp = await speakOnce(" ", 0.5, 1.0, null, sessionId);
        if (!warmedUp) return;

        for (let rep = 0; rep < 3; rep++) {
          const okWord = await speakOnce(word, wordRate, 1.0, null, sessionId);
          if (!okWord) return;

          const keepAfterWord = await pauseBetween(wordPause, sessionId);
          if (!keepAfterWord) return;

          for (const ch of word) {
            const okCh = await speakOnce(ch, letterRate, 1.0, null, sessionId);
            if (!okCh) return;

            const keepAfterCh = await pauseBetween(letterPause, sessionId);
            if (!keepAfterCh) return;
          }

          if (rep < 2) {
            const keep = await pauseBetween(800, sessionId);
            if (!keep) return;
          }
        }

        if (!isSpeechSessionActive(sessionId)) return;
        isSpeaking = false;
        speakerBig.classList.remove("speaking");
        speakBtn.disabled = false;
      }

      function speakPraise(text) {
        stopSpeech();
        speakOnce(text, 0.75, 1.0);
      }

      // Navigation
      function nextWord() {
        if (!wordsList.length) return;
        currentIndex = (currentIndex + 1) % wordsList.length;
        renderWord();
        updateProgress();
        resetSpellInputs();
      }

      function prevWord() {
        if (!wordsList.length) return;
        currentIndex = (currentIndex - 1 + wordsList.length) % wordsList.length;
        renderWord();
        updateProgress();
        resetSpellInputs();
      }

      function shuffleWords() {
        if (!wordsList.length) return;
        for (let i = wordsList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [wordsList[i], wordsList[j]] = [wordsList[j], wordsList[i]];
        }
        currentIndex = 0;
        shuffled = true;

        renderWord();
        updateProgress();
        buildWordBank();
        stopSpeech();
        resetSpellInputs();
      }

      function resetProgress() {
        currentIndex = 0;
        if (shuffled) {
          wordsList = WORDS[currentGrade].slice();
          shuffled = false;
          buildWordBank();
        }
        renderWord();
        updateProgress();
        stopSpeech();
        resetSpellInputs();
      }

      // Spell tab
      function resetSpellInputs() {
        feedback.textContent = "\u00A0";
        feedback.className = "feedback idle";
        spellHintBox.innerHTML = `💡 Click "Hint" to hear the word again and get a clue`;
        spellHintBox.classList.remove("revealed");
        buildDashInputs();
      }

      function buildDashInputs() {
        const item = wordsList[currentIndex];
        if (!item) return;

        const len = item.word.length;
        dashRow.innerHTML = "";

        for (let i = 0; i < len; i++) {
          const input = document.createElement("input");
          input.type = "text";
          input.maxLength = 1;
          input.className = "dash-input";
          input.autocomplete = "off";
          input.autocapitalize = "characters";
          input.spellcheck = false;
          input.setAttribute("aria-label", `Letter ${i + 1}`);

          input.addEventListener("input", (e) => {
            const v = e.target.value.replace(/[^a-zA-Z]/g, "").toUpperCase();
            e.target.value = v;
            e.target.classList.toggle("filled", v.length === 1);

            if (v.length === 1) {
              const next = dashRow.children[i + 1];
              if (next) next.focus();
            }
          });

          input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && !e.target.value) {
              const prev = dashRow.children[i - 1];
              if (prev) {
                prev.focus();
                prev.value = "";
                prev.classList.remove("filled");
              }
            }
            if (e.key === "ArrowLeft" && i > 0) dashRow.children[i - 1].focus();
            if (e.key === "ArrowRight" && i < len - 1) dashRow.children[i + 1].focus();
            if (e.key === "Enter") {
              e.preventDefault();
              checkSpelling();
            }
          });

          dashRow.appendChild(input);
        }

        setTimeout(() => {
          if (dashRow.children[0]) dashRow.children[0].focus();
        }, 50);
      }

      function readSpelling() {
        let out = "";
        for (const inp of dashRow.children) {
          out += (inp.value || "").toUpperCase();
        }
        return out;
      }

      function checkSpelling() {
        const item = wordsList[currentIndex];
        if (!item) return;

        const target = item.word.toUpperCase();
        const attempt = readSpelling();

        if (attempt.length < target.length) {
          feedback.textContent = `✏️ Fill all ${target.length} boxes!`;
          feedback.className = "feedback wrong";
          speakOnce("Please fill all the letters, Oluwatosin.", 0.7, 1.0);
          return;
        }

        if (attempt === target) {
          for (const inp of dashRow.children) inp.classList.add("correct");
          feedback.textContent = "🌟 Brilliant!";
          feedback.className = "feedback correct";
          speakPraise("Brilliant!");
          launchConfetti();
        } else {
          for (const inp of dashRow.children) inp.classList.add("wrong");
          feedback.textContent = "💪 Try again!";
          feedback.className = "feedback wrong";
          speakPraise("You can do it. Try again.");
          setTimeout(() => {
            for (const inp of dashRow.children) inp.classList.remove("wrong");
          }, 1000);
        }
      }

      function showSpellHint() {
        const item = wordsList[currentIndex];
        if (!item) return;

        const word = item.word.toUpperCase();
        spellHintBox.innerHTML =
          `💡 <strong>Meaning:</strong> ${item.hint}<br>` +
          `🔤 <strong>Starts with:</strong> "${word[0]}" &nbsp;•&nbsp; ` +
          `<strong>Letters:</strong> ${word.length} &nbsp;•&nbsp; ` +
          `<strong>Ends with:</strong> "${word[word.length - 1]}"`;

        spellHintBox.classList.add("revealed");
        speakWordClearly();
      }

      // Tab switching
      function switchTab(tab) {
        currentTab = tab;

        tabStudy.classList.toggle("active", tab === "study");
        tabSpell.classList.toggle("active", tab === "spell");

        studyPanel.classList.toggle("hidden", tab !== "study");
        spellPanel.classList.toggle("hidden", tab !== "spell");

        stopSpeech();
        if (tab === "spell") {
          resetSpellInputs();
          setTimeout(() => speakWordClearly(), 250);
        }
      }

      function updateCountBadges() {
        for (const g of [1, 2, 3]) {
          countBadges[g].textContent = WORDS[g].length;
        }
      }

      function launchConfetti() {
        const emojis = ["🎉", "⭐", "🌈", "✨", "🎈", "🐝", "🍬", "🍭", "🧁"];
        for (let i = 0; i < 38; i++) {
          const c = document.createElement("span");
          c.className = "confetti";
          c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          c.style.left = (Math.random() * 100) + "vw";
          c.style.animationDelay = (Math.random() * 0.4) + "s";
          c.style.animationDuration = (1.4 + Math.random() * 2.2) + "s";
          c.style.fontSize = (1.2 + Math.random() * 1.5) + "rem";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4200);
        }
      }

      function init() {
        buildStars();
        updateCountBadges();
        loadVoices();
        if ("speechSynthesis" in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
          setTimeout(loadVoices, 250);
          setTimeout(loadVoices, 1000);
        }

        loadGrade(1);

        tabStudy.addEventListener("click", () => switchTab("study"));
        tabSpell.addEventListener("click", () => switchTab("spell"));

        gradeBtns.forEach(btn => {
          btn.addEventListener("click", (e) => {
            const g = parseInt(e.currentTarget.dataset.grade, 10);
            if (g === currentGrade) return;
            loadGrade(g);
          });
        });

        speakBtn.addEventListener("click", speakStudyWord);
        prevBtn.addEventListener("click", () => { prevWord(); speakStudyWord(); });
        nextBtn.addEventListener("click", () => { nextWord(); speakStudyWord(); });
        shuffleBtn.addEventListener("click", () => { shuffleWords(); speakStudyWord(); });
        resetBtn.addEventListener("click", resetProgress);

        speakerBig.addEventListener("click", speakWordClearly);
        spellSpeakBtn.addEventListener("click", speakWordClearly);
        spellHintBtn.addEventListener("click", showSpellHint);
        spellCheckBtn.addEventListener("click", checkSpelling);

        spellPrevBtn.addEventListener("click", prevWord);
        spellNextBtn.addEventListener("click", () => {
          nextWord();
          setTimeout(() => speakWordClearly(), 250);
        });
        spellResetBtn.addEventListener("click", resetProgress);

        toggleWordList.addEventListener("click", toggleWordBank);

        document.addEventListener("keydown", (e) => {
          const tag = document.activeElement?.tagName || "";
          const isTyping = tag === "INPUT" || tag === "TEXTAREA";

          if (currentTab === "study") {
            if (e.code === "Space" && !e.repeat && !isTyping) {
              e.preventDefault();
              speakStudyWord();
            }
            if (e.code === "ArrowRight") { e.preventDefault(); nextWord(); }
            if (e.code === "ArrowLeft") { e.preventDefault(); prevWord(); }
            if (e.code === "Home") { e.preventDefault(); resetProgress(); }
          } else {
            if (e.code === "Space" && !e.repeat && !isTyping) {
              e.preventDefault();
              speakStudyWord();
            }
            if (e.code === "ArrowLeft" && !isTyping) { e.preventDefault(); prevWord(); }
            if (e.code === "ArrowRight" && !isTyping) { e.preventDefault(); nextWord(); }
            if (e.code === "Home") { e.preventDefault(); resetProgress(); }
          }
        });
      }

      init();
    })();
  </script>
</body>
